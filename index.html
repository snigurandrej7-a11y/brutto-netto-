<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureText Utility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        textarea { background: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="flex flex-col items-center p-8">
    <h1 class="text-4xl font-black mb-8 italic">PureText<span class="text-blue-500">.</span></h1>
    <div class="w-full max-w-xl space-y-4">
        <textarea id="txt" class="w-full h-64 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Paste messy text..."></textarea>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="document.getElementById('txt').value = document.getElementById('txt').value.replace(/\r?\n|\r/g, ' ').replace(/\s\s+/g, ' ').trim()" class="bg-blue-600 py-4 rounded-xl font-bold uppercase">Clean</button>
            <button onclick="navigator.clipboard.writeText(document.getElementById('txt').value)" class="bg-slate-700 py-4 rounded-xl font-bold uppercase">Copy</button>
        </div>
        <div class="mt-10 p-10 border-2 border-dashed border-slate-800 rounded-3xl text-center opacity-30 text-[10px] uppercase tracking-widest">Ad Space</div>
    </div>
</body>
</html>
